<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="TradingView">
  <title>TradingView</title>
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="manifest" href="./manifest.webmanifest">
  <style>
    html,body { width:100%; min-height:100%; margin:0; background:#000; color:#fff; }
    body { min-height:100vh; min-height:100dvh; font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
    .message { position:absolute; top:calc(env(safe-area-inset-top, 0px) + 44px); left:16px; text-align:left; font-size:clamp(18px,5vw,24px); letter-spacing:.01em; font-weight:400; }
    button { -webkit-tap-highlight-color:transparent; appearance:none; border:0; background:transparent; color:inherit; font:inherit; padding:0; margin:0; cursor:default; }
    button:focus { outline:none; }
    #corner, #corner-left { position:fixed; bottom:0; width:64px; height:64px; padding:0; }
    #corner { right:0; }
    #corner-left { left:0; }
  </style>
</head>
<body>
  <main class="message"><button type="button" id="error">Error</button> 404 Not Found</main>
  <button type="button" id="corner" aria-label=""></button>
  <button type="button" id="corner-left" aria-label=""></button>
  <script>
    (() => {
      let step = 0;
      document.getElementById('error').addEventListener('click', () => { step = 1; });
      document.getElementById('corner').addEventListener('click', () => { if (step === 1) step = 2; });
      document.getElementById('corner-left').addEventListener('click', () => {
        if (step === 2) window.location.assign('https://www.redgifs.com');
      });
    })();
  </script>
</body>
</html>
